buildscript {
	ext {
		springBootVersion = '3.0.5.RELEASE'
	}
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}") 
	}
}



// apply plugin: 'java'
// apply plugin: 'eclipse'
// apply plugin: 'spring-boot' 
plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot' version '3.0.5'
    id 'io.spring.dependency-management' version '1.1.4'
}


// jar {
// 	baseName = 'mobilemoney'
// 	version = '0.0.1-SNAPSHOT'
// }
jar {
    archiveBaseName.set('mobilemoney')
    archiveVersion.set('0.0.1-SNAPSHOT')
}

// sourceCompatibility = 1.8
// targetCompatibility = 1.8
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


repositories {
	mavenCentral()
}


dependencies {
	// compile('org.springframework.boot:spring-boot-starter')
	// compile('org.springframework.boot:spring-boot-starter-web')
	// compile('org.springframework.boot:spring-boot-starter-jetty')
	// compile('org.hibernate:hibernate-core:4.3.6.Final')
	// compile('org.springframework.boot:spring-boot-starter-data-jpa:1.1.4.RELEASE')
	// compile('commons-dbcp:commons-dbcp:1.4')
	// compile('org.javassist:javassist')
	// compile('org.springframework.boot:spring-boot-starter-actuator')
	// compile("com.fasterxml.jackson.core:jackson-databind")
        implementation('org.mariadb.jdbc:mariadb-java-client:3.3.3')	
        implementation('jakarta.persistence:jakarta.persistence-api:3.1.0')
        implementation('org.hibernate.orm:hibernate-core:6.1.7.Final')
	implementation('org.springframework.boot:spring-boot-starter')
	implementation('org.springframework.boot:spring-boot-starter-web')
	implementation('org.springframework.boot:spring-boot-starter-jetty')
	implementation('org.hibernate:hibernate-core:4.3.6.Final')
	implementation('org.springframework.boot:spring-boot-starter-data-jpa:1.1.4.RELEASE')
	implementation('commons-dbcp:commons-dbcp:1.4')
	// implementation('org.javassist:javassist')
	implementation("org.javassist:javassist:3.29.2-GA")
	implementation('org.springframework.boot:spring-boot-starter-actuator')
	testImplementation('org.springframework.boot:spring-boot-starter-test')

	implementation("com.fasterxml.jackson.core:jackson-databind")
	// testCompile("junit:junit")
	testImplementation("junit:junit")
	// runtime('mysql:mysql-connector-java')
	runtimeOnly('mysql:mysql-connector-java:8.0.33')

	// testCompile('org.springframework.boot:spring-boot-starter-test') 
	// testCompile('junit:junit:4.10')
	testImplementation('org.springframework.boot:spring-boot-starter-test') 
	testImplementation('junit:junit:4.10')
}


eclipse {
	classpath {
		 containers.remove('org.eclipse.jdt.launching.JRE_CONTAINER')
		 containers 'org.eclipse.jdt.launching.JRE_CONTAINER/org.eclipse.jdt.internal.debug.ui.launcher.StandardVMType/JavaSE-1.8'
	}
}
